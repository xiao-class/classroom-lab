 const division=stageIndex<3?0:bioEase(localTime/9);
 const align=stageIndex===0?bioEase(Math.max(0,localTime-7)/5):1;
 const chromosomes=Array.from({length:4},(_,i)=>({id:i,color:i<2?'#a9f0c1':'#d4acff',y:139+i*74,length:i%2===0?32:23,x:480+(1-align)*((i%2===0?-1:1)*96)}));
 return {split,separation,division,align,chromosomes,cells:division>=1?2:1,chromosomesPerCell:division>=1?4:split?8:4,dnaPerCell:division>=1?4:8,totalDNA:8};
}
function mitosisSVG(state){
 const {stageIndex,localTime}=state,m=mitosisModel(stageIndex,localTime);
 const cell=(cx,rx,opacity=1)=>`<ellipse cx="${cx}" cy="250" rx="${rx}" ry="185" fill="url(#cell)" stroke="#76bcb2" stroke-width="3" opacity="${opacity}"/><ellipse cx="${cx}" cy="250" rx="${rx-8}" ry="177" fill="none" stroke="#8ce4bd" stroke-opacity=".16" stroke-width="2"/>`;
 let membrane;
 if(stageIndex<3)membrane=cell(480,340+25*m.separation);
 else if(m.division>=1)membrane=cell(287,175)+cell(673,175);
 else{const q=m.division,neck=185*(1-q)+4*q;membrane=`<path d="M480 ${250-neck} C${340-70*q} 12 107 25 115 250 C107 475 ${340-70*q} 488 480 ${250+neck} C${620+70*q} 488 853 475 845 250 C853 25 ${620+70*q} 12 480 ${250-neck}Z" fill="url(#cell)" stroke="#76bcb2" stroke-width="3"/>`;}
 const poles=[170,790];let fibers='',chrom='';
 for(const c of m.chromosomes){
  const sep=175*m.separation;
  const h=c.length;
  const strand=(x,dir)=>`<path d="M${x+dir*15} ${c.y-h} Q${x} ${c.y-5} ${x} ${c.y} Q${x} ${c.y+5} ${x+dir*15} ${c.y+h}" fill="none" stroke="${c.color}" stroke-width="10" stroke-linecap="round"/><circle cx="${x}" cy="${c.y}" r="5" fill="#f2ffdf"/>`;
  const x1=c.x-(m.split?sep:4),x2=c.x+(m.split?sep:4);
  const fiberOpacity=stageIndex===3?1-m.division:stageIndex===0?m.align:.75;
  fibers+=`<path d="M${poles[0]} 250Q300 ${c.y-32} ${x1} ${c.y} M${poles[1]} 250Q660 ${c.y-32} ${x2} ${c.y}" fill="none" stroke="#8fdccd" stroke-width="1.7" opacity="${fiberOpacity}"/>`;
  if(stageIndex===3){
   // Morph each DNA trace into chromatin without drawing a second copy.
   for(const [x,dir] of [[x1,1],[x2,-1]]){
    const points=Array.from({length:25},(_,j)=>{const u=j/12-1,from=x+dir*15*Math.abs(u),to=x+Math.sin((u+1)*Math.PI*2.1)*16-dir*6;return [(1-m.division)*from+m.division*to,c.y+u*h];});
    chrom+=`<path d="${points.map((p,i)=>(i?'L':'M')+p.join(' ')).join(' ')}" fill="none" stroke="${c.color}" stroke-width="${10-7*m.division}" stroke-linecap="round"/>`;
   }
  }else chrom+=strand(x1,1)+strand(x2,-1);
 }
 const nuclei=stageIndex===3?`<ellipse cx="305" cy="250" rx="106" ry="165" fill="#7397d4" fill-opacity="${m.division*.08}" stroke="#a1b5df" stroke-width="2" stroke-opacity="${m.division}"/><ellipse cx="655" cy="250" rx="106" ry="165" fill="#7397d4" fill-opacity="${m.division*.08}" stroke="#a1b5df" stroke-width="2" stroke-opacity="${m.division}"/>`:stageIndex===0?`<ellipse cx="480" cy="250" rx="240" ry="170" fill="none" stroke="#a1b5df" stroke-width="2" stroke-dasharray="9 8" opacity="${1-m.align}"/>`:'';
 const halos=poles.map(x=>`<circle cx="${x}" cy="250" r="24" fill="#b7f8d0" opacity=".05"/><circle cx="${x}" cy="250" r="8" fill="#b7f8d0"/>`).join('');
 return `<defs><radialGradient id="bio-bg"><stop stop-color="#183d3f"/><stop offset="1" stop-color="#091b25"/></radialGradient><radialGradient id="cell" cx="40%" cy="28%"><stop stop-color="#2c6460" stop-opacity=".7"/><stop offset=".78" stop-color="#15403f" stop-opacity=".7"/><stop offset="1" stop-color="#4c8b77" stop-opacity=".5"/></radialGradient></defs><rect width="960" height="500" fill="url(#bio-bg)"/>
 <text x="32" y="38" fill="#a9d9c5" font-size="22" letter-spacing="2">生物 / 有丝分裂</text><text x="928" y="38" fill="#9ebdbd" font-size="20" text-anchor="end">动物细胞 · 2n＝4 示意</text>
 ${membrane}${nuclei}${fibers}${stageIndex===3?'':halos}${chrom}
 ${stageIndex===1?'<path d="M480 87V414" stroke="#d5d3a1" stroke-dasharray="6 7" opacity=".5"/><text x="500" y="100" fill="#e5e4b2" font-size="22">赤道板</text>':''}
 <text x="480" y="476" text-anchor="middle" font-size="23" fill="#d2e9df">${['分裂前已完成 DNA 复制：先认清姐妹染色单体。','四条复制后的染色体排列在细胞中央。','姐妹染色单体分离，分别移向两极。','核膜重建，胞质分裂形成两个子细胞。'][stageIndex]}</text>`;
}
function createExperiment(svg){return {
 render(state){svg.innerHTML=mitosisSVG(state).replace(/font-size="(\d+)"/g, 'font-size="$1" style="font-size:$1px"');const m=mitosisModel(state.stageIndex,state.localTime);return {metrics:[{label:'细胞数（示意）',value:m.cells},{label:m.cells===2?'每个子细胞染色体':'当前细胞染色体',value:m.chromosomesPerCell+' 条'},{label:m.cells===2?'每个子细胞核 DNA':'当前细胞核 DNA',value:m.dnaPerCell+' 个'}],observation:'从已完成 DNA 复制开始；颜色用于追踪，非真实染色。后期分开后，每条原染色单体计为一条染色体。',explanation:m.cells===2?'两个子细胞各有4条染色体、4个核DNA分子；不把DNA复制放在分裂后期。':m.split?'后期在同一细胞内暂有8条染色体，核DNA总数仍为8；每极各4条。':'目前有4条复制后的染色体，每条含两条姐妹染色单体；核DNA分子共8个。'};},
 check(){if(mitosisModel(1,0).chromosomesPerCell!==4||mitosisModel(2,2).chromosomesPerCell!==8)throw Error('染色体计数错误');const end=mitosisModel(3,12);if(end.cells*end.dnaPerCell!==8||end.chromosomesPerCell!==4)throw Error('子细胞遗传物质分配错误');return ['分裂前4条染色体/8个核DNA','后期同一细胞8条染色体/8个核DNA','子细胞各4条染色体/4个核DNA'];}
};}

</script>
<script>
'use strict';
(() => {
const $ = id => document.getElementById(id);
const lesson = JSON.parse($('lesson-data').textContent);
if(lesson.presentation==='cinematic')document.documentElement.dataset.presentation='cinematic';
let experiment, frame = null, last = null, activeStage = 0;
const state = {time:0, playing:false, params:{}, revealed:false};
const controls = new Map();
const voice = $('narration-audio');
let voiceEnabled = true, customParameters = false, audioStage = -1, audioToken = 0;
const hasNarration = lesson.stages.some(s=>s.audio);
function voiceStatus(message='') {$('voice-status').textContent=message;$('voice-status').hidden=!message;}
function syncAudio() {
 const token=++audioToken, stage=lesson.stages[activeStage];
 if(audioStage!==activeStage){voice.pause();audioStage=activeStage;voice.src=stage.audio||'';}
 if(!hasNarration){voiceStatus('本文件未包含讲解音频。');return;}
 const offset=Math.max(0,state.time-stage.at);
 const duration=stage.audioDuration||voice.duration;
 if(!state.playing||!voiceEnabled||customParameters||!stage.audio||(Number.isFinite(duration)&&offset>=duration)){
  voice.pause();
  if(customParameters)voiceStatus('你已改变实验条件，固定讲解暂停；重播恢复演示和讲解。');
  return;
 }
 voiceStatus();
 try{voice.currentTime=offset;}catch{}
 const started=voice.play();
 if(started)started.catch(e=>{if(token===audioToken&&e.name!=='AbortError')voiceStatus('声音未能播放，请再点一次播放或检查设备声音。');});
}
voice.addEventListener('error',()=>{if(lesson.stages[audioStage]?.audio)voiceStatus('讲解音频无法读取，动画仍可使用。');});
const make = (tag,text) => {const el=document.createElement(tag); if(text!==undefined)el.textContent=text; return el;};
function report(err) { pause(); $('error').hidden=false; $('error').textContent='演示需要修正：'+err.message; $('play').disabled=true; }
function stageAt(t) {let n=0;lesson.stages.forEach((s,i)=>{if(t>=s.at)n=i;});return n;}
function defaultsThrough(index) {
 const values=Object.fromEntries(lesson.parameters.map(p=>[p.key,p.value]));
 for(let i=0;i<=index;i++)Object.assign(values,lesson.stages[i].values||{});
 return values;
}
function syncInputs() {lesson.parameters.forEach(p=>{const c=controls.get(p.key);c.input.value=state.params[p.key];c.output.textContent=state.params[p.key]+(p.unit?' '+p.unit:'');});}
function render() {
 const s=lesson.stages[activeStage];
 $('stage-label').textContent=String(activeStage+1).padStart(2,'0')+' / '+s.title;
 $('question').textContent=s.question; $('explanation').textContent=s.explanation; $('explanation').hidden=!state.revealed;
 $('reveal').textContent=state.revealed?'隐藏解释':'显示解释';$('reveal').setAttribute('aria-pressed',String(state.revealed));
 $('clock').textContent=state.time.toFixed(1)+' / '+lesson.duration+' 秒';$('timeline').value=state.time;
 $('play').textContent=state.playing?'暂停':'播放演示';
 $('previous').disabled=activeStage===0;$('next').disabled=activeStage===lesson.stages.length-1;
 [...$('steps').children].forEach((b,i)=>{if(i===activeStage)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');});
 try{
 const result=experiment.render({time:state.time,localTime:state.time-s.at,stageIndex:activeStage,params:{...state.params},revealed:state.revealed,manualParameters:customParameters})||{};
 $('metrics').replaceChildren(...(result.metrics||[]).map(m=>{const d=make('div');d.className='metric';d.append(make('span',m.label),make('strong',String(m.value)));return d;}));
 $('observation').textContent=result.observation||'';
 if(result.question!==undefined)$('question').textContent=result.question;
 if(result.explanation!==undefined)$('explanation').textContent=result.explanation;
 }catch(e){report(e);}
}
function advance(t, recompute=false) {
 const next=stageAt(t);
 if(next!==activeStage||recompute) {
  state.params=defaultsThrough(next);activeStage=next;state.revealed=false;customParameters=false;voiceStatus();syncInputs();
 }
 state.time=t;render();
 if(audioStage!==activeStage||recompute)syncAudio();
}
function tick(now) {
 if(!state.playing)return;
 if(last!==null)advance(Math.min(lesson.duration,state.time+(now-last)/1000));
 last=now;
 if(!state.playing)return;
 if(state.time>=lesson.duration){pause();return;}
 frame=requestAnimationFrame(tick);
}
function pause(){++audioToken;voice.pause();state.playing=false;last=null;if(frame!==null)cancelAnimationFrame(frame);frame=null;if(experiment)$('play').textContent='播放演示';}
function play(){if($('error').hidden===false)return;if(state.playing)return;if(state.time>=lesson.duration)reset();state.playing=true;last=null;$('play').textContent='暂停';syncAudio();frame=requestAnimationFrame(tick);}
function seek(t){pause();if(!Number.isFinite(Number(t)))throw Error('进度必须为数值');advance(Math.max(0,Math.min(lesson.duration,Number(t))));}
function reset(){pause();advance(0,true);voice.currentTime=0;}
function setParameter(key,value) {
 const p=lesson.parameters.find(p=>p.key===key);value=Number(value);
 if(!p||!Number.isFinite(value)||value<p.min||value>p.max||Math.abs((value-p.min)/p.step-Math.round((value-p.min)/p.step))>1e-7)throw Error('参数超出范围或步长不匹配');
 pause();customParameters=true;state.params[key]=value;state.time=lesson.stages[activeStage].at;state.revealed=false;syncInputs();render();syncAudio();
}
function goStage(i){pause();advance(lesson.stages[i].at,true);}
try{
 $('title').textContent=lesson.title;$('subtitle').textContent=lesson.subtitle;$('model-note').textContent=lesson.modelNote;
 $('scene').setAttribute('aria-label',lesson.title+'：'+lesson.modelNote);
 $('timeline').max=lesson.duration;
 if(!lesson.parameters.length)$('parameter-panel').hidden=true;
 lesson.parameters.forEach(p=>{
  const label=make('label');label.className='param';const head=make('span');head.className='param-head';
  const input=make('input');input.type='range';input.id='param-'+p.key;input.min=p.min;input.max=p.max;input.step=p.step;input.setAttribute('aria-label',p.label);
  const output=make('output');output.htmlFor=input.id;head.append(make('span',p.label),output);label.append(head,input);$('parameters').append(label);
  controls.set(p.key,{input,output});input.addEventListener('input',()=>setParameter(p.key,input.value));
 });
 lesson.stages.forEach((s,i)=>{const b=make('button',String(i+1).padStart(2,'0')+' '+s.title);b.onclick=()=>goStage(i);$('steps').append(b);});
 lesson.sources.forEach(s=>{const p=make('p');const a=make('a',s.label);a.href=s.url;a.target='_blank';a.rel='noopener noreferrer';p.append(a);$('sources').append(p);});
 const script=lesson.title+'\n\n'+lesson.stages.map(s=>s.title+'（'+s.at+'秒起）\n'+s.narration).join('\n\n')+'\n\n模型说明：'+lesson.modelNote;
 $('script').textContent=script;
 $('download-script').onclick=()=>{const url=URL.createObjectURL(new Blob([script],{type:'text/plain;charset=utf-8'}));const a=make('a');a.href=url;a.download='课堂讲解稿.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 experiment=createExperiment($('scene'));
 if(!experiment||typeof experiment.render!=='function')throw Error('实验缺少render方法');
 const checks=typeof experiment.check==='function'?experiment.check():[];
 $('checks').textContent=checks.length?'模型自检：'+checks.join('；'):'本文件未提供自动模型检查，请核对科学关系。';
 window.classroomLab={seek,play,pause,reset,setParameter,checks,getState:()=>({...state,params:{...state.params},stageIndex:activeStage})};
 $('play').onclick=()=>state.playing?pause():play();$('reset').onclick=reset;
 $('voice-toggle').disabled=!hasNarration;
 $('voice-toggle').textContent=hasNarration?'讲解：开':'无讲解音频';
 $('voice-toggle').onclick=()=>{voiceEnabled=!voiceEnabled;$('voice-toggle').textContent=voiceEnabled?'讲解：开':'讲解：关';$('voice-toggle').setAttribute('aria-pressed',String(voiceEnabled));syncAudio();};
 $('previous').onclick=()=>goStage(Math.max(0,activeStage-1));$('next').onclick=()=>goStage(Math.min(lesson.stages.length-1,activeStage+1));
 $('timeline').oninput=()=>seek($('timeline').value);
 $('reveal').onclick=()=>{state.revealed=!state.revealed;render();};
 $('fullscreen').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen();else $('fullscreen').textContent='请用浏览器全屏';}catch{$('fullscreen').textContent='请用浏览器全屏';}};
 document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'退出全屏':'全屏演示';});
 window.addEventListener('pagehide',pause);
 document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});
 document.addEventListener('keydown',e=>{if(e.target.closest('button,input,select,textarea,a,summary')||e.ctrlKey||e.metaKey||e.altKey)return;
 if(e.code==='Space'){e.preventDefault();state.playing?pause():play();}
 if(e.code==='ArrowRight'){e.preventDefault();goStage(Math.min(lesson.stages.length-1,activeStage+1));}
 if(e.code==='ArrowLeft'){e.preventDefault();goStage(Math.max(0,activeStage-1));}});
 reset();
}catch(e){report(e);}
})();
</script>
